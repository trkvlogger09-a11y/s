        body {

            padding: 20px;

        .card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            padding: 35px 24px 28px;
            text-align: center;
            border: 1px solid rgba(255, 0, 60, .28);
            border-radius: 32px;
            background: rgba(18, 10, 18, .94);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, .85),
                0 0 35px rgba(255, 0, 60, .13),
                inset 0 1px 1px rgba(255, 255, 255, .12);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #ff003c,
                #ff91a9,
                #ff003c,
                transparent
            );
            box-shadow: 0 0 14px #ff003c;
        }

        /* Profile Image */
        .profile-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 145px;
            height: 145px;
            margin: 0 auto 24px;
        }

        .profile-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255, 0, 60, .32);
            filter: blur(18px);
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        .rotating-ring-1,
        .rotating-ring-2 {
            position: absolute;
            border-radius: 50%;
        }

        .rotating-ring-1 {
            inset: 0;
            background: conic-gradient(
                from 0deg,
                transparent 30%,
                #ff003c 70%,
                #fff 98%,
                transparent 100%
            );
            animation: spinRing 2.2s linear infinite;
        }

        .rotating-ring-2 {
            inset: 3px;
            background: conic-gradient(
                from 180deg,
                transparent 40%,
                #ff3366 80%,
                #fff 98%,
                transparent 100%
            );
            opacity: .7;
            animation: spinRing 3.5s linear infinite reverse;
        }

        .profile-inner-bg {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: #110712;
            z-index: 1;
        }

        .profile-img {
            position: relative;
            z-index: 2;
            width: calc(100% - 18px);
            height: calc(100% - 18px);
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, .6);
        }

        @keyframes pulseGlow {
            from {
                opacity: .4;
                transform: scale(.95);
            }
            to {
                opacity: .9;
                transform: scale(1.08);
            }
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        /* Heading */

            align-items: center;
            justify-content: center;

                inset 0 1px 1px rgba(255, 255, 255, .35);
            animation: buttonFloat 2.5s ease-in-out infinite;
            transition: filter .25s ease;
        }

        .premium-btn::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: -50%;
            left: -80%;
            width: 45%;
            height: 200%;
            transform: rotate(25deg);
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, .42),
                transparent
            );
            animation: shine 3s ease-in-out infinite;
            pointer-events: none;
        }

        .premium-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        .premium-btn:active {
            filter: brightness(1.15);

        @keyframes buttonFloat {
            0%, 100% {

        @media (prefers-reduced-motion: reduce) {

            *::before,
            *::after {
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

    (() => {

            "https://t.me/+GsoWAyGUD2AwM2Vh",

        let index = 0;
